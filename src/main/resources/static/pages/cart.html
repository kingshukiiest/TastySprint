<!-- PAGE 2: CART & CHECKOUT -->
<h2 style="margin-bottom: 1.5rem; color: #0f172a;">Shopping Cart & Checkout</h2>
<div class="grid-2">
    <!-- Cart Items Summary -->
    <div class="card">
        <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: #0f172a;">Your Selected Dishes</h3>
        <div id="cart-items-container">
            <p class="text-muted">Loading shopping cart items...</p>
        </div>
        
        <div style="margin-top: 1.5rem; border-top: 2px solid var(--border); padding-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 1.1rem; font-weight: 700; color: #0f172a;">Total Payable:</span>
            <span id="cart-total-amount" style="font-size: 1.5rem; font-weight: 800; color: #0f172a;">₹0</span>
        </div>
    </div>

    <!-- Delivery Address & Order Checkout -->
    <div>
        <div class="card">
            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: #0f172a;">Select Delivery Address</h3>
            <div class="form-group">
                <label>Saved Addresses</label>
                <select id="select-address-dropdown">
                    <option value="">Loading addresses...</option>
                </select>
            </div>
            <button id="btn-submit-order" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">⚡ Confirm & Place Order</button>
        </div>

        <!-- Add Address Card -->
        <div class="card">
            <h4 style="margin-bottom: 1rem; color: #0f172a;">+ Add New Delivery Address</h4>
            <form id="form-add-address">
                <div class="form-group">
                    <label>Street / Area</label>
                    <input type="text" id="addr-street" placeholder="e.g. 45 Park Street, Flat 3B" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="addr-city" placeholder="Kolkata" required>
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" id="addr-state" placeholder="West Bengal" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" id="addr-pincode" placeholder="700016" required>
                    </div>
                    <div class="form-group">
                        <label>Address Tag</label>
                        <select id="addr-type">
                            <option value="HOME">HOME</option>
                            <option value="WORK">WORK</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-secondary" style="width: 100%;">Save Address</button>
            </form>
        </div>
    </div>
</div>
