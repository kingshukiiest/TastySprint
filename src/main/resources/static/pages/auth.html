<!-- PAGE 5: AUTHENTICATION (LOGIN / REGISTER) -->
<div class="auth-container">
    <div class="auth-toggle">
        <button id="btn-toggle-login" class="auth-toggle-btn active" onclick="toggleAuthMode('login')">Sign In</button>
        <button id="btn-toggle-register" class="auth-toggle-btn" onclick="toggleAuthMode('register')">Register Account</button>
    </div>

    <!-- Login Form Box -->
    <div id="auth-login-box" class="card">
        <h2 style="margin-bottom: 0.5rem; color: #0f172a;">Welcome Back</h2>
        <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 1.5rem;">Sign in to issue JWT Bearer Token and access APIs.</p>

        <form id="form-login">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="customer@tastysprint.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Sign In & Issue JWT</button>
        </form>

        <!-- Quick Demo Autofill -->
        <div class="demo-bar">
            <div class="demo-btn" onclick="fillDemo('customer@tastysprint.com', 'password123')">👤 Customer Demo</div>
            <div class="demo-btn" onclick="fillDemo('owner@tastysprint.com', 'password123')">🏪 Owner Demo</div>
            <div class="demo-btn" onclick="fillDemo('admin@tastysprint.com', 'password123')">👑 Admin Demo</div>
        </div>
    </div>

    <!-- Registration Form Box -->
    <div id="auth-register-box" class="card" style="display:none;">
        <h2 style="margin-bottom: 0.5rem; color: #0f172a;">Join TASTY SPRINT</h2>
        <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 1.5rem;">Create a new account with your preferred system role.</p>

        <form id="form-register">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="e.g. Rahul Sharma" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="rahul.sharma@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-pass" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="reg-phone" placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
                <label>System Role</label>
                <select id="reg-role" onchange="toggleOwnerFields(this.value)">
                    <option value="CUSTOMER">CUSTOMER (Order food, add to cart, review)</option>
                    <option value="RESTAURANT_OWNER">RESTAURANT_OWNER (Manage restaurant & release orders)</option>
                    <option value="ADMIN">ADMIN (Full platform administration)</option>
                </select>
            </div>

            <!-- Restaurant Owner Fields -->
            <div id="owner-fields-box" style="display:none; border-top:1px solid var(--border); padding-top:1rem; margin-top:1rem;">
                <div class="form-group">
                    <label>Restaurant Name</label>
                    <input type="text" id="reg-rest-name" placeholder="e.g. Royal Biryani & Mughlai Station">
                </div>
                <div class="form-group">
                    <label>Restaurant Address</label>
                    <input type="text" id="reg-rest-addr" placeholder="e.g. 12 Park Street, Kolkata">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Register Account</button>
        </form>
    </div>
</div>
