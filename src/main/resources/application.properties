
# APPLICATION CONFIGURATION

spring.application.name=food-ordering-system
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# SPRING DATA JPA / HIBERNATE CONFIGURATION
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Disabling OSIV (Open Session In View) prevents unintended DB queries during JSON serialization
spring.jpa.open-in-view=false

# ==================================================
# JWT SECURITY CONFIGURATION
# ==================================================
# Secret key encoded in Hex (at least 256 bits for HMAC-SHA256)
app.jwt.secret=9a2f8c4e1b7d5a0f3e6c9b2a5d8f1e4c7b0a3f6e9d2c5b8a1f4e7d0c3b6a9f2e
# Expiration time in milliseconds (86400000 ms = 24 hours)
app.jwt.expiration-ms=86400000

# ==================================================
# OPENAPI / SWAGGER CONFIGURATION
# ==================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
