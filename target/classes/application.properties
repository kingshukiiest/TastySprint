# APPLICATION CONFIGURATION
spring.application.name=food-ordering-system
server.port=${PORT:8080}

# ==================================================
# DATASOURCE CONFIGURATION (H2 Default for Cloud Deployment, Overridable for MySQL)
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:food_ordering_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ==================================================
# SPRING DATA JPA / HIBERNATE CONFIGURATION
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==================================================
# JWT SECURITY CONFIGURATION
# ==================================================
app.jwt.secret=9a2f8c4e1b7d5a0f3e6c9b2a5d8f1e4c7b0a3f6e9d2c5b8a1f4e7d0c3b6a9f2e
app.jwt.expiration-ms=86400000

# ==================================================
# OPENAPI CONFIGURATION
# ==================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
